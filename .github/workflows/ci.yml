name: Authority package qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - run: bash scripts/check-package.sh
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/authority-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authority-evidence
          path: ${{ runner.temp }}/authority-evidence/*
          if-no-files-found: error
